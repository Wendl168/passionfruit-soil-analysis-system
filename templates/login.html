{% extends "base.html" %}
{% block title %}登录 - 百香果智能土壤分析系统{% endblock %}
{% block content %}
<div class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">🥝</div>
            <h1>登录</h1>
            <p>百香果智能土壤分析系统</p>
        </div>
        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login" class="auth-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" class="form-input" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="form-input" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary auth-btn">登 录</button>
        </form>
        <div class="auth-footer">
            还没有账号？<a href="/register">立即注册</a>
        </div>
    </div>
</div>
<style>
.auth-page {
    min-height: 70vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
}
.auth-card {
    background: white;
    border-radius: 24px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    border: 1px solid #e5e7eb;
    width: 100%;
    max-width: 400px;
    padding: 2.5rem 2rem;
}
.auth-header {
    text-align: center;
    margin-bottom: 2rem;
}
.auth-icon {
    font-size: 3rem;
    margin-bottom: 0.75rem;
}
.auth-header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #111827;
    margin: 0 0 0.25rem;
}
.auth-header p {
    font-size: 0.875rem;
    color: #6b7280;
    margin: 0;
}
.auth-form .form-group {
    margin-bottom: 1.25rem;
}
.auth-form .form-group label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    color: #374151;
    margin-bottom: 0.375rem;
}
.auth-form .form-input {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 0.9375rem;
    color: #111827;
    background: #f9fafb;
    box-sizing: border-box;
    transition: border-color 0.2s, box-shadow 0.2s;
}
.auth-form .form-input:focus {
    outline: none;
    border-color: #22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.15);
    background: white;
}
.auth-btn {
    width: 100%;
    padding: 0.875rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    margin-top: 0.5rem;
}
.auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    font-size: 0.875rem;
    color: #6b7280;
}
.auth-footer a {
    color: #16a34a;
    font-weight: 600;
    text-decoration: none;
}
.auth-footer a:hover {
    text-decoration: underline;
}
.error-message {
    background: #fee2e2;
    color: #991b1b;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    font-size: 0.875rem;
    margin-bottom: 1rem;
    text-align: center;
}
</style>
{% endblock %}
